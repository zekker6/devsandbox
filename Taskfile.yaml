version: "3"

dotenv:
  - internal/embed/versions.env

vars:
  GIT_COMMIT:
    sh: git rev-parse --short HEAD 2>/dev/null || echo "unknown"
  BUILD_DATE:
    sh: date -Iseconds 2>/dev/null || date -u +"%Y-%m-%dT%H:%M:%S%z"
  GIT_DIRTY:
    sh: test -n "$(git status --porcelain 2>/dev/null)" && echo "true" || echo "false"
  # Hash of uncommitted changes (short md5 of git diff output)
  GIT_DIRTY_HASH:
    sh: |
      if [ "$(git status --porcelain 2>/dev/null)" ]; then
        git diff HEAD 2>/dev/null | md5 2>/dev/null | cut -c1-7 || git diff HEAD 2>/dev/null | md5sum | cut -c1-7
      else
        echo ""
      fi
  # Git tag for the current commit, or "dev" if not tagged
  GIT_VERSION:
    sh: git describe --tags --exact-match 2>/dev/null || echo "dev"
  BWRAP_REPO: https://github.com/containers/bubblewrap.git
  PASTA_REPO: https://passt.top/passt
  # passt 2026_07_28 calls close_range()/CLOSE_RANGE_UNSHARE from isolation.c, which
  # does not include linux_dep.h - upstream's fallback for libcs that lack both (musl
  # 1.2.5, the Alpine builder). Force the header in; drop this once upstream includes it.
  PASTA_CFLAGS: -static -include linux_dep.h

tasks:
  default:
    cmds:
      - task --list-all

  lint:
    deps:
      - vet
      - fmt
      - golangci

  vet:
    cmds:
      - go vet ./...

  fmt:
    cmds:
      - gofmt -l -w -s ./

  golangci:
    cmds:
      - golangci-lint run

  cross-test:
    desc: Verify tests compile for all release targets (linux/darwin × amd64/arm64)
    cmds:
      - GOOS=linux GOARCH=amd64 go test -exec true ./...
      - GOOS=linux GOARCH=arm64 go test -exec true ./...
      - GOOS=darwin GOARCH=amd64 go test -exec true ./...
      - GOOS=darwin GOARCH=arm64 go test -exec true ./...

  cross-build:
    desc: Verify build compiles for all release targets (linux/darwin × amd64/arm64)
    cmds:
      - GOOS=linux GOARCH=amd64 go build ./...
      - GOOS=linux GOARCH=arm64 go build ./...
      - GOOS=darwin GOARCH=amd64 go build ./...
      - GOOS=darwin GOARCH=arm64 go build ./...

  test:
    cmds:
      - go test ./internal/... ./cmd/devsandbox/... ./cmd/devsandbox-shim/...
      # Compile-only check for the KVM-gated krun integration tests. They live
      # behind the integration_krun build tag and only run on a /dev/kvm host, so
      # routine tasks never compile them - a helper signature drift would go
      # unnoticed. `-exec true` builds the test binary but runs `true` instead of
      # it, so this type-checks the tagged package without booting a microVM.
      - go test -exec true -tags integration_krun ./test/integration/...
      # Same compile-only check for the e2e docker tests. They live behind the
      # e2e build tag and need a `devsandbox:local` image to do anything, so no
      # routine task compiles them - a helper signature drift in the untagged
      # e2e files would go unnoticed. This type-checks them without running one.
      - go test -exec true -tags e2e ./e2e/...
      - task: test:plugins

  test:plugins:
    desc: Checks for the bundled Claude Code plugins
    cmds:
      # The triage hook matches devsandbox's own output, so a message reworded
      # in the Go sources can silently stop it matching. Nothing in `go test`
      # covers a shell hook, which is why this runs as part of `task test`.
      - bash .claude-plugin/devsandbox-triage/scripts/triage_test.sh
      # The config skill routes by URL into the published site, so a page
      # renamed or moved under docs/ leaves it fetching a 404 with nothing to
      # notice. Map each URL back to the source file the site builds it from
      # and require that file to exist.
      - |
        skill=.claude-plugin/devsandbox-config/skills/devsandbox-config/SKILL.md
        missing=0
        for path in $(grep -oE 'docs/[a-z0-9][a-z0-9/-]*/' "$skill" | sed -E 's,^docs/,,; s,/$,,' | sort -u); do
          if [ -f "docs/$path.md" ]; then
            echo "ok       docs/$path.md"
          else
            echo "MISSING  docs/$path.md  (skill fetches .../docs/$path/)"
            missing=1
          fi
        done
        exit "$missing"

  test:e2e:
    deps:
      - build
    cmds:
      - go test -v ./e2e/...

  test:integration:krun:
    desc: KVM-gated krun integration test (boots a real microVM; skips cleanly without /dev/kvm)
    cmds:
      # Skip the whole run on a host without hardware virtualization so the
      # target is safe to invoke anywhere (the in-test prerequisite checks would
      # also skip, but this avoids the binary build on non-KVM hosts). The guard
      # and the test must share one shell so the early return short-circuits it.
      - |
        if [ ! -e /dev/kvm ]; then
          echo "SKIP: /dev/kvm absent - krun integration tests require hardware virtualization"
          exit 0
        fi
        go test -tags integration_krun -v ./test/integration/...

  test:all:
    cmds:
      - go test -v ./...

  deps:update:
    cmds:
      - go get -u ./...
      - go mod tidy

  build:
    desc: Build all binaries for local development
    deps:
      - build:devsandbox
      - build:shim

  build:devsandbox:
    desc: Build main devsandbox binary
    cmds:
      - mkdir -p bin
      - >-
        go build -ldflags
        "-X devsandbox/internal/version.Version={{.GIT_VERSION}}
        -X devsandbox/internal/version.Commit={{.GIT_COMMIT}}
        -X devsandbox/internal/version.Date={{.BUILD_DATE}}
        -X devsandbox/internal/version.Dirty={{.GIT_DIRTY}}
        -X devsandbox/internal/version.DirtyHash={{.GIT_DIRTY_HASH}}
        -X devsandbox/internal/embed.BwrapVersion={{.BWRAP_TAG}}
        -X devsandbox/internal/embed.PastaVersion={{.PASTA_TAG}}"
        -o bin/devsandbox ./cmd/devsandbox

  build:shim:
    desc: Build devsandbox-shim binary
    cmds:
      - mkdir -p bin
      - go build -o bin/devsandbox-shim ./cmd/devsandbox-shim

  release:snapshot:
    desc: Build snapshot release using goreleaser (for testing)
    cmds:
      - set -a && . internal/embed/versions.env && goreleaser release --snapshot --clean

  install:
    desc: Install binary to ~/.local/bin
    deps:
      - build
    cmds:
      - mkdir -p ~/.local/bin
      - rm -f ~/.local/bin/devsandbox
      - cp bin/devsandbox ~/.local/bin/

  prune-local:
    cmds:
      - rm -rf ~/.local/share/devsandbox/

  docker:build:
    desc: Build the devsandbox Docker image
    cmds:
      - docker build -t devsandbox:local -f docker/Dockerfile .

  krun:build:
    desc: Build the devsandbox image into podman's store (used by the krun backend)
    cmds:
      # krun (podman) has its own image store - docker:build does not reach it.
      # Tag BOTH names: project Dockerfiles build FROM devsandbox:local, while the
      # auto-generated config-dir Dockerfile builds FROM the ghcr tag and re-tags
      # devsandbox:local from it on every launch, which would otherwise revert a
      # locally built devsandbox:local to a stale base.
      - podman build -t devsandbox:local -t ghcr.io/zekker6/devsandbox:latest -f docker/Dockerfile .

  docker:test:
    desc: Test the devsandbox Docker image
    deps: [docker:build]
    cmds:
      - docker run --rm -v "{{.PWD}}:/workspace" -e HOST_UID=$(id -u) -e HOST_GID=$(id -g) devsandbox:local bash -c "whoami && mise --version"

  # --- Embed builder images ---

  embed:builder:amd64:
    internal: true
    deps:
      - embed:setup-qemu
    cmds:
      - >-
        docker build --platform linux/amd64
        -t devsandbox-embed-builder:amd64
        -f internal/embed/Dockerfile.builder internal/embed/

  embed:builder:arm64:
    internal: true
    deps:
      - embed:setup-qemu
    cmds:
      - >-
        docker build --platform linux/arm64
        -t devsandbox-embed-builder:arm64
        -f internal/embed/Dockerfile.builder internal/embed/

  embed:builder:host:
    internal: true
    vars:
      HOST_ARCH:
        sh: uname -m | sed 's/x86_64/amd64/' | sed 's/aarch64/arm64/'
    cmds:
      - >-
        docker build
        -t devsandbox-embed-builder:{{.HOST_ARCH}}
        -f internal/embed/Dockerfile.builder internal/embed/

  # --- Individual binary builds ---

  embed:build:bwrap-amd64:
    internal: true
    deps: [embed:builder:amd64]
    cmds:
      - mkdir -p internal/embed/bin/amd64
      - >-
        docker run --rm --platform linux/amd64
        --user $(id -u):$(id -g)
        -v {{.PWD}}/internal/embed/bin/amd64:/out
        devsandbox-embed-builder:amd64 sh -c '
        git clone --depth 1 --branch {{.BWRAP_TAG}} {{.BWRAP_REPO}} /tmp/build &&
        cd /tmp/build &&
        LDFLAGS=-static meson setup _build --prefer-static -Ddefault_library=static -Dtests=false &&
        meson compile -C _build &&
        cp _build/bwrap /out/bwrap &&
        strip /out/bwrap
        '

  embed:build:bwrap-arm64:
    internal: true
    deps: [embed:builder:arm64]
    cmds:
      - mkdir -p internal/embed/bin/arm64
      - >-
        docker run --rm --platform linux/arm64
        --user $(id -u):$(id -g)
        -v {{.PWD}}/internal/embed/bin/arm64:/out
        devsandbox-embed-builder:arm64 sh -c '
        git clone --depth 1 --branch {{.BWRAP_TAG}} {{.BWRAP_REPO}} /tmp/build &&
        cd /tmp/build &&
        LDFLAGS=-static meson setup _build --prefer-static -Ddefault_library=static -Dtests=false &&
        meson compile -C _build &&
        cp _build/bwrap /out/bwrap &&
        strip /out/bwrap
        '

  embed:build:pasta-amd64:
    internal: true
    deps: [embed:builder:amd64]
    cmds:
      - mkdir -p internal/embed/bin/amd64
      - >-
        docker run --rm --platform linux/amd64
        --user $(id -u):$(id -g)
        -v {{.PWD}}/internal/embed/bin/amd64:/out
        devsandbox-embed-builder:amd64 sh -c '
        git clone --depth 1 --branch {{.PASTA_TAG}} {{.PASTA_REPO}} /tmp/build &&
        cd /tmp/build &&
        CFLAGS="{{.PASTA_CFLAGS}}" make pasta pasta.avx2 &&
        cp pasta pasta.avx2 /out/ &&
        strip /out/pasta /out/pasta.avx2
        '

  embed:build:pasta-arm64:
    internal: true
    deps: [embed:builder:arm64]
    cmds:
      - mkdir -p internal/embed/bin/arm64
      - >-
        docker run --rm --platform linux/arm64
        --user $(id -u):$(id -g)
        -v {{.PWD}}/internal/embed/bin/arm64:/out
        devsandbox-embed-builder:arm64 sh -c '
        git clone --depth 1 --branch {{.PASTA_TAG}} {{.PASTA_REPO}} /tmp/build &&
        cd /tmp/build &&
        CFLAGS="{{.PASTA_CFLAGS}}" make pasta &&
        cp pasta /out/pasta &&
        strip /out/pasta
        '
  # --- Public entry points ---
  embed:build:
    desc: Build static bwrap and pasta binaries for all platforms (arm64 requires QEMU binfmt)
    deps:
      - embed:build:bwrap-amd64
      - embed:build:bwrap-arm64
      - embed:build:pasta-amd64
      - embed:build:pasta-arm64

  embed:latest-tags:
    desc: Print latest upstream tags for bwrap and pasta
    cmds:
      - |
        echo "=== Current pinned ==="
        echo "  BWRAP_TAG: {{.BWRAP_TAG}}"
        echo "  PASTA_TAG: {{.PASTA_TAG}}"
        echo ""
        echo "=== Latest upstream ==="
        bwrap_tag=$(git ls-remote --tags --sort=-v:refname {{.BWRAP_REPO}} 'refs/tags/v*' | grep -v '\^{}' | head -1 | sed 's|.*refs/tags/||')
        echo "  bwrap: ${bwrap_tag}"
        pasta_tag=$(git ls-remote --tags {{.PASTA_REPO}} | grep -v '\^{}' | sed 's|.*refs/tags/||' | sort -t. -k1,1 | tail -1)
        echo "  pasta: ${pasta_tag}"

  embed:setup-qemu:
    desc: Set up QEMU binfmt for cross-platform Docker builds (run on host, not in sandbox)
    cmds:
      - docker run --privileged --rm tonistiigi/binfmt --install arm64

  embed:verify:
    desc: Verify embedded binaries are real (not placeholders)
    cmds:
      - |
        for arch in amd64 arm64; do
          for bin in bwrap pasta; do
            f="internal/embed/bin/${arch}/${bin}"
            if ! file "$f" | grep -q "ELF"; then
              echo "FAIL: $f is not an ELF binary (run 'task embed:build' first)"
              exit 1
            fi
            echo "OK: $f — $(file "$f" | cut -d: -f2)"
          done
        done

  # --- Documentation site (Zensical + landing page on GitHub Pages) ---

  site:install:
    desc: Ensure documentation site deps are installed (zensical via mise)
    cmds:
      - mise install

  site:snippets:
    desc: Regenerate docs/.include/ (README + CHANGELOG with site-relative links)
    cmds:
      # README.md and CHANGELOG.md are snippet-included into docs/index.md and
      # docs/about/changelog.md. Their links are written relative to the repo
      # root (`docs/proxy.md`) so they resolve when the files are browsed on
      # GitHub, but a snippet's links are resolved against the *including* page,
      # not the file they came from - on the site those same links would point
      # at /docs/docs/proxy/ and /docs/about/docs/proxy/. Rebase them onto each
      # including page instead of duplicating the two files by hand.
      # `task site:check` is the backstop for any link shape this misses.
      - mkdir -p docs/.include
      - |
        sed -E 's,\]\(docs/,](,g' README.md > docs/.include/README.md
      - |
        sed -E 's,\]\(docs/,](../,g' CHANGELOG.md > docs/.include/CHANGELOG.md

  site:dev:
    desc: Run docs + landing dev servers locally (loopback only)
    # site:snippets output is static: `zensical serve` reloads on docs/ changes,
    # but an edit to README.md or CHANGELOG.md needs this task run again.
    deps: [site:install, site:snippets]
    cmds:
      # bash -c so we can use named-signal trap (sh/dash rejects INT/TERM)
      - |
        bash -c '
          trap "kill 0" INT TERM EXIT
          echo ""
          echo "  Landing:  http://127.0.0.1:8001/"
          echo "  Docs:     http://127.0.0.1:8000/"
          echo ""
          python -m http.server 8001 --bind 127.0.0.1 --directory site/landing &
          mise exec -- zensical serve -a 127.0.0.1:8000 &
          wait
        '

  site:build:
    desc: Build the documentation site to ./public/
    deps: [site:install, site:snippets]
    cmds:
      # Wipe both output and Zensical's snippet cache.
      # `zensical build --clean` does not invalidate snippet-included content
      # (e.g., updates to README.md don't propagate without removing .cache).
      - rm -rf public/ .cache/
      # --strict turns Zensical's own unresolvable-link warnings into a build
      # failure. It only sees links it can resolve from the Markdown source;
      # `task site:check` covers the rendered output, snippets included.
      - mise exec -- zensical build --clean --strict
      # Strip internal-only dirs that Zensical may have rendered if they exist locally.
      # CI checkouts don't have these, so this is a local-dev safety net.
      - rm -rf public/docs/plans public/docs/summaries public/docs/superpowers
      - mkdir -p public/
      - cp -r site/landing/. public/
      - 'echo "Built: public/index.html (landing) + public/docs/ (zensical)"'

  site:check:
    desc: Verify every internal link and anchor in ./public, which site:build must have produced (external links are not fetched)
    cmds:
      - mise exec -- python3 site/linkcheck.py

  site:clean:
    desc: Remove built site, generated snippets and Zensical caches
    cmds:
      - rm -rf public/ .cache/ docs/.include/
