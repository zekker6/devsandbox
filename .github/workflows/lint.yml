name: CI

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
  pull_request: { }

jobs:
  lint:
    name: Lint & Unit Tests
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Install mise
        uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5
        with:
          install: true

      - name: Run lint
        run: task lint

      - name: Install shells for wrapper tests
        run: sudo apt-get update && sudo apt-get install -y fish zsh

      - name: Run unit tests
        run: task test

      - name: Run build
        run: task build

  docs:
    name: Docs Site Links
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install mise
        uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5
        with:
          install: true
          cache: true

      - name: Build and check site
        run: task site:build site:check

  e2e:
    name: E2E Tests
    runs-on: ubuntu-26.04
    needs: [lint]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap
          # Install passt if available
          sudo apt-get install -y passt || echo "passt not available in apt"

      # Ubuntu 23.10+ refuses user namespaces to any binary without an AppArmor
      # profile. The packaged bwrap has one; the embedded bwrap devsandbox
      # extracts and runs does not, so without this every sandbox launch fails
      # with "setting up uid map: Permission denied".
      - name: Allow unprivileged user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      # Fail rather than let the sandbox tests skip: a skipped e2e suite once
      # passed green for months with zero sandbox coverage. unshare has no
      # AppArmor profile, so it sees what the embedded bwrap sees.
      - name: Check user namespace support
        run: unshare --user --map-root-user true

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Install mise
        uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5
        with:
          install: true

      - name: Install CI tools via mise
        run: |
          cp .mise.ci.toml .mise.toml
          mise install

      # The sandbox sees only its project directory (e2e/ under go test) and a
      # fixed PATH, so mirror a typical dev host: CI tools in the global mise
      # config, and mise itself in ~/.local/bin, where its installer puts it,
      # rather than mise-action's ~/.local/share/mise/bin.
      - name: Expose mise and CI tools to the sandbox
        run: |
          mkdir -p ~/.config/mise ~/.local/bin
          cp .mise.ci.toml ~/.config/mise/config.toml
          ln -sf "$(command -v mise)" ~/.local/bin/mise

      - name: Run e2e tests
        run: task test:e2e

  macos:
    name: macOS Unit Tests
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Install mise
        uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5
        with:
          install: true

      - name: Run unit tests
        run: task test
