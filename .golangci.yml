version: "2"

run:
  timeout: 5m
  modules-download-mode: readonly

linters:
  settings:
    staticcheck:
      checks:
        - all
        - -ST1000
        - -ST1003
        - -ST1016
        - -ST1020
        - -ST1021
        - -ST1022
        - -SA4023
  exclusions:
    paths:
      - vendor
      - tmp
    rules:
      - path: '_test\.go'
        linters:
          - staticcheck
        text: "SA5011"
